# Tagged — Simple Server (SQLite). Data lives in the tagged_data volume.
#   docker compose up -d          # build + run
#   open http://localhost:8080/   # complete the first-run setup wizard
#
# For the Performance Server (bundled Postgres), add the override:
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d
services:
  tagged:
    build: .
    image: ghcr.io/taggedhq/server:latest
    ports:
      - "8080:8080"
    volumes:
      - tagged_data:/data
    environment:
      # Optional comma-separated admin usernames. The setup wizard also creates
      # the first admin, so this can be left empty.
      TAGGED_ADMINS: ""
    restart: unless-stopped

volumes:
  tagged_data:
