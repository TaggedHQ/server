<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tagged · Skill Levels</title>
  <link rel="stylesheet" href="{{PREFIX}}css/all.min.css?v={{V}}">
  <link rel="stylesheet" href="{{PREFIX}}css/style.css?v={{V}}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{PREFIX}}images/favicon_light/favicon-32x32.png?v={{V}}">
  <meta name="tt-prefix" content="{{PREFIX}}">
  <meta name="tt-version" content="{{V}}">
</head>
<body>
  <div class="app">
    {{SIDEBAR}}

    <div class="content single">
      <div class="main-col" style="width:100%">
        <div class="page-head">
          <div>
            <h1 data-i18n="Skill Levels">Skill Levels</h1>
            <p class="page-sub" data-i18n="The proficiency scale everyone rates against, lowest first.">The proficiency scale everyone rates against, lowest first.</p>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h3 data-i18n="Proficiency levels">Proficiency levels</h3>
            <span class="sub" data-i18n="Lowest first, 2 to 10 rungs">Lowest first, 2 to 10 rungs</span>
          </div>
          <div id="sc-levels"></div>
          <div class="ud-actions" style="margin-top:12px">
            <button class="secondary btn-sm" id="sc-add-level">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:5px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              <span data-i18n="Add level">Add level</span>
            </button>
            <button id="sc-save-levels" data-i18n="Save levels">Save levels</button>
          </div>
          <p class="um-note muted" style="margin-top:10px" data-i18n="Shortening the scale does not delete anyone's rating: ratings above the new top rung are shown at the top rung instead.">Shortening the scale does not delete anyone's rating: ratings above the new top rung are shown at the top rung instead.</p>
          <div id="sc-levels-msg" class="msg"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="{{PREFIX}}js/core.js?v={{V}}"></script>
  <script src="{{PREFIX}}js/skills.js?v={{V}}"></script>
</body>
</html>
