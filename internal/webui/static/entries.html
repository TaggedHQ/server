<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tagged · Time entries</title>
  <link rel="stylesheet" href="{{PREFIX}}css/style.css?v={{V}}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{PREFIX}}images/favicon_light/favicon-32x32.png?v={{V}}">
  <meta name="tt-prefix" content="{{PREFIX}}">
  <meta name="tt-version" content="{{V}}">
</head>
<body>
  <div class="app">
    {{SIDEBAR}}

    <div class="content" id="entries-layout">
      <div class="main-col" style="width:100%">
        <div class="page-head">
          <h1 data-i18n="Time entries">Time entries</h1>
          <div class="head-actions">
            <button id="open-report" class="secondary">▤ <span data-i18n="Report">Report</span></button>
            <button id="new-entry" class="btn-round" title="New entry" data-i18n-title="New entry" aria-label="New entry" data-i18n-aria-label="New entry">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>
        </div>

        <div class="panel">
          <div class="week-head">
            <button class="icon-btn" id="week-prev" title="Previous week" data-i18n-title="Previous week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
            <span class="wtitle">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
              <span id="week-title">—</span>
            </span>
            <button class="icon-btn" id="week-next" title="Next week" data-i18n-title="Next week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>
          </div>
          <div class="week-days" id="week-days"></div>
          <div class="week-total"><span data-i18n="Total">Total</span><span class="wt-val" id="week-total">0h 00m</span></div>
        </div>

        <div class="view-switch-row">
          <div class="view-switch" id="view-switch" role="tablist" aria-label="View" data-i18n-aria-label="View">
            <button type="button" class="vs-btn" data-view="list" role="tab">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
              <span data-i18n="List">List</span>
            </button>
            <button type="button" class="vs-btn" data-view="timeline" role="tab">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18"/><rect x="4" y="5" width="8" height="4" rx="1"/><rect x="12" y="14" width="8" height="4" rx="1"/></svg>
              <span data-i18n="Timeline">Timeline</span>
            </button>
          </div>
        </div>

        <div class="timeline" id="view-timeline" hidden>
          <div class="tl-toolbar">
            <span class="tl-range">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
              <span id="tl-range">—</span>
            </span>
            <div class="tl-controls">
              <button class="secondary btn-sm" id="tl-today" title="Jump to now" data-i18n-title="Jump to now" data-i18n="Today">Today</button>
              <div class="tl-group">
                <button class="icon-btn" id="tl-up" title="Earlier — ↑ / PageUp" data-i18n-title="Earlier — ↑ / PageUp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 15l-6-6-6 6"/></svg></button>
                <button class="icon-btn" id="tl-down" title="Later — ↓ / PageDown" data-i18n-title="Later — ↓ / PageDown"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button>
              </div>
              <div class="tl-group">
                <button class="icon-btn" id="tl-zoom-out" title="Zoom out — →" data-i18n-title="Zoom out — →"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M8 11h6"/></svg></button>
                <button class="icon-btn" id="tl-zoom-in" title="Zoom in — ←" data-i18n-title="Zoom in — ←"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M11 8v6M8 11h6"/></svg></button>
              </div>
            </div>
          </div>
          <div class="tl-wrap" id="tl-wrap" tabindex="0">
            <div class="tl-canvas" id="tl-canvas"></div>
          </div>
          <div class="tl-foot">
            <span><span class="tl-foot-val" id="tl-visible-total">0h 00m</span> <span data-i18n="in view">in view</span></span>
            <span class="tl-hint" data-i18n="Scroll or ↑ ↓ to pan · ← → to zoom · double-click to add">Scroll or ↑ ↓ to pan · ← → to zoom · double-click to add</span>
          </div>
        </div>

        <div id="view-list">
          <div class="day-head"><span id="day-title">—</span><span id="day-total">0h 00m</span></div>
          <div class="te-list" id="te-list"></div>
        </div>
      </div>

      <aside class="side-col">
        <div class="panel um-details" id="entry-details">
          <div class="um-empty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            <p data-i18n="Select an entry to view its details and actions.">Select an entry to view its details and actions.</p>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <div class="modal-overlay" id="entry-modal" hidden>
    <div class="sheet">
      <div class="sheet-title" id="em-title">Edit Entry</div>

      <div class="sheet-section">
        <div class="sheet-label" data-i18n="Description">Description</div>
        <input id="em-desc" class="em-input" type="text" placeholder="What did you work on?" data-i18n-placeholder="What did you work on?" autocomplete="off">
      </div>

      <div class="sheet-section">
        <div class="sheet-section-head">
          <span class="sheet-label" data-i18n="Tags">Tags</span>
          <div class="em-add-anchor">
            <button id="em-add-tag" class="link-accent" type="button">＋ <span data-i18n="Add">Add</span></button>
            <div class="menu-pop em-tag-menu" id="em-tag-menu"></div>
          </div>
        </div>
        <div class="em-tags" id="em-tags"></div>
        <div id="em-add-wrap" hidden>
          <div class="em-add-row">
            <input id="em-tag-input" type="text" placeholder="New tag name" data-i18n-placeholder="New tag name" autocomplete="off">
            <button id="em-tag-add-btn" class="btn-sm" type="button" data-i18n="Add">Add</button>
          </div>
        </div>
      </div>

      <div class="sheet-section">
        <div class="sheet-label" style="margin-bottom:4px" data-i18n="Time">Time</div>
        <div class="time-row">
          <span class="tr-label" data-i18n="Start">Start</span>
          <div class="tr-inputs"><input type="date" id="em-start-date"><input type="time" id="em-start-time"></div>
        </div>
        <div class="time-row">
          <span class="tr-label" data-i18n="End">End</span>
          <div class="tr-inputs"><input type="date" id="em-end-date"><input type="time" id="em-end-time"></div>
        </div>
      </div>

      <div class="em-msg" id="em-msg"></div>
      <div class="sheet-actions">
        <button id="em-delete" class="danger-btn" type="button" hidden data-i18n="Delete">Delete</button>
        <div class="spacer"></div>
        <button id="em-cancel" class="secondary" type="button" data-i18n="Cancel">Cancel</button>
        <button id="em-save" type="button" data-i18n="Save">Save</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="report-modal" hidden>
    <div class="sheet report">
      <div class="sheet-title" data-i18n="Report">Report</div>

      <div class="sheet-section">
        <div class="rep-grid">
          <label class="rep-field">
            <span class="sheet-label" data-i18n="From">From</span>
            <input type="date" id="rp-from">
          </label>
          <label class="rep-field">
            <span class="sheet-label" data-i18n="To">To</span>
            <input type="date" id="rp-to">
          </label>
          <label class="rep-field">
            <span class="sheet-label" data-i18n="Grouping">Grouping</span>
            <select class="set-select" id="rp-grouping">
              <option value="none" data-i18n="None">None</option>
              <option value="tags" data-i18n="Tags">Tags</option>
              <option value="ds" data-i18n="Description">Description</option>
            </select>
          </label>
          <label class="rep-field">
            <span class="sheet-label" data-i18n="Group by period">Group by period</span>
            <select class="set-select" id="rp-period">
              <option value="none" data-i18n="None">None</option>
              <option value="day" data-i18n="Day">Day</option>
              <option value="week" data-i18n="Week">Week</option>
              <option value="month" data-i18n="Month">Month</option>
              <option value="quarter" data-i18n="Quarter">Quarter</option>
              <option value="year" data-i18n="Year">Year</option>
            </select>
          </label>
          <label class="rep-field">
            <span class="sheet-label" data-i18n="Duration format">Duration format</span>
            <select class="set-select" id="rp-format">
              <option value="hm">9:07</option>
              <option value="hms">9:07:24</option>
              <option value="h0">9</option>
              <option value="h1">9.1</option>
              <option value="h2">9.12</option>
              <option value="h3">9.123</option>
            </select>
          </label>
          <label class="rep-field rep-check">
            <span class="sheet-label" data-i18n="Details">Details</span>
            <label class="rep-inline"><input type="checkbox" id="rp-records" checked> <span data-i18n="Show records">Show records</span></label>
          </label>
        </div>
      </div>

      <div class="sheet-section">
        <div class="sheet-label" style="margin-bottom:10px" data-i18n="Export as file">Export as file</div>
        <div class="rep-export">
          <input type="text" id="rp-filename" class="rep-filename" placeholder="filename" autocomplete="off" spellcheck="false">
          <div class="rep-export-btns">
            <button type="button" class="secondary btn-sm" id="rp-csv">⬇ CSV</button>
            <button type="button" class="secondary btn-sm" id="rp-pdf">⬇ PDF</button>
            <button type="button" class="secondary btn-sm" id="rp-copy">⧉ <span data-i18n="Copy table">Copy table</span></button>
          </div>
        </div>
        <div class="rep-msg" id="rp-msg"></div>
      </div>

      <div class="rep-preview" id="rp-preview"></div>

      <div class="sheet-actions">
        <div class="spacer"></div>
        <button type="button" class="secondary" id="rp-close" data-i18n="Close">Close</button>
      </div>
    </div>
  </div>

  <script src="{{PREFIX}}js/core.js?v={{V}}"></script>
  <script src="{{PREFIX}}js/entries.js?v={{V}}"></script>
</body>
</html>
