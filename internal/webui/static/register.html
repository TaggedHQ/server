<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account · Tagged</title>
  <link rel="stylesheet" href="{{PREFIX}}style.css?v={{V}}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{PREFIX}}images/favicon_light/favicon-32x32.png?v={{V}}">
  <meta name="tt-prefix" content="{{PREFIX}}">
  <meta name="tt-version" content="{{V}}">
</head>
<body>
  <div class="center-page">
    <div class="card narrow">
      <div class="auth-head">
        <img class="auth-logo" src="{{PREFIX}}images/Taggd-Colored.svg?v={{V}}" alt="Tagged logo">
        <div class="brandmark lg">Tagged</div>
        <p class="subtitle" data-i18n="Create a new account">Create a new account</p>
      </div>
      <form id="register-form">
        <label for="username" data-i18n="Username">Username</label>
        <input id="username" type="text" autocomplete="username" required>
        <label for="password" data-i18n="Password">Password</label>
        <input id="password" type="password" autocomplete="new-password" required>
        <label for="password2" data-i18n="Confirm password">Confirm password</label>
        <input id="password2" type="password" autocomplete="new-password" required>
        <button class="block" type="submit" data-i18n="Create account">Create account</button>
      </form>
      <div id="msg" class="msg"></div>
      <p class="alt">Already have an account? <a href="{{PREFIX}}login" data-i18n="Log in">Log in</a></p>
    </div>
  </div>
  <script src="{{PREFIX}}app.js?v={{V}}"></script>
</body>
</html>
