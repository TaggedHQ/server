<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tagged · Categories</title>
  <link rel="stylesheet" href="{{PREFIX}}css/all.min.css?v={{V}}">
  <link rel="stylesheet" href="{{PREFIX}}css/style.css?v={{V}}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{PREFIX}}images/favicon_light/favicon-32x32.png?v={{V}}">
  <meta name="tt-prefix" content="{{PREFIX}}">
  <meta name="tt-version" content="{{V}}">
</head>
<body>
  <div class="app">
    {{SIDEBAR}}

    <div class="content" id="skillcats-layout">
      <div class="main-col" style="width:100%">
        <div class="page-head">
          <div>
            <h1 data-i18n="Categories">Categories</h1>
            <p class="page-sub" data-i18n="How skills are filed. Every skill belongs to one category, which gives it its colour.">How skills are filed. Every skill belongs to one category, which gives it its colour.</p>
          </div>
          <div class="head-actions">
            <button id="sc-add-btn" class="btn-round" title="Add category" data-i18n-title="Add category" aria-label="Add category" data-i18n-aria-label="Add category">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>
        </div>

        <div class="panel um-panel">
          <div class="um-toolbar">
            <div class="search-field">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
              <input id="sc-search" type="text" placeholder="Search categories…" data-i18n-placeholder="Search categories…" autocomplete="off">
            </div>
            <label class="sk-check">
              <input type="checkbox" id="sc-show-archived">
              <span data-i18n="Show archived">Show archived</span>
            </label>
          </div>
          <div class="table-wrap">
            <table class="utable um-table">
              <thead>
                <tr>
                  <th data-i18n="Category">Category</th>
                  <th data-i18n="Skills">Skills</th>
                  <th data-i18n="Status">Status</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="sc-body">
                <tr><td colspan="4" class="muted" data-i18n="Loading…">Loading…</td></tr>
              </tbody>
            </table>
          </div>
          <div class="um-foot">
            <span id="sc-count" class="muted"></span>
          </div>
          <div id="sc-cats-msg" class="msg"></div>
        </div>
      </div>

      <aside class="side-col">
        <div class="panel um-details" id="sc-details"></div>
      </aside>
    </div>
  </div>

  <!-- Create / edit category. One sheet for both. -->
  <div class="modal-overlay" id="sc-modal" hidden>
    <div class="sheet" style="max-width:420px">
      <div class="sheet-title" id="sc-modal-title" data-i18n="New category">New category</div>
      <div class="sheet-section">
        <div class="sheet-label" data-i18n="Name">Name</div>
        <input id="sc-name" class="em-input" type="text" placeholder="Equipment" autocomplete="off">
      </div>
      <div class="sheet-section">
        <div class="sheet-label" data-i18n="Colour">Colour</div>
        <input id="sc-color" class="em-input sk-color-input" type="color" value="#4C82F7">
      </div>
      <div class="sheet-section">
        <label class="sk-check">
          <input type="checkbox" id="sc-archived-toggle">
          <span data-i18n="Archived">Archived</span>
        </label>
        <p class="um-note muted" data-i18n="Archived categories are hidden when adding a skill, but keep the skills already filed under them.">Archived categories are hidden when adding a skill, but keep the skills already filed under them.</p>
      </div>
      <div id="sc-modal-msg" class="msg"></div>
      <div class="sheet-actions">
        <button class="secondary" id="sc-cancel" data-i18n="Cancel">Cancel</button>
        <button id="sc-save" data-i18n="Save">Save</button>
      </div>
    </div>
  </div>

  <script src="{{PREFIX}}js/core.js?v={{V}}"></script>
  <script src="{{PREFIX}}js/skills.js?v={{V}}"></script>
</body>
</html>
