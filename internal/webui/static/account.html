<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tagged · Account</title>
  <link rel="stylesheet" href="{{PREFIX}}style.css">
  <link rel="icon" type="image/svg+xml" href="{{PREFIX}}images/Taggd-Colored.svg">
  <script>window.TT_PREFIX = "{{PREFIX}}";</script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="side-brand">
        <img class="logo" src="{{PREFIX}}images/Taggd-Colored.svg" alt="Tagged logo">
        <span class="brandmark" style="letter-spacing:.12em;color:var(--text-1)">Tagged</span>
      </div>
      <nav class="nav">
        <a href="{{PREFIX}}">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          <span>Dashboard</span>
        </a>
        <a href="{{PREFIX}}entries">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          <span>Time entries</span>
        </a>
        <a href="{{PREFIX}}tags">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h8l10 10-8 8L3 11V3z"/><circle cx="7.5" cy="7.5" r="1.5" fill="currentColor" stroke="none"/></svg>
          <span>Tags</span>
        </a>
        <a class="active" href="{{PREFIX}}account">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.5-2.3 1a7 7 0 0 0-1.7-1l-.4-2.5h-4l-.4 2.5a7 7 0 0 0-1.7 1l-2.3-1-2 3.5 2 1.5a7 7 0 0 0 0 2l-2 1.5 2 3.5 2.3-1a7 7 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7 7 0 0 0 1.7-1l2.3 1 2-3.5-2-1.5a7 7 0 0 0 .1-1z"/></svg>
          <span>Settings</span>
        </a>
        <a id="nav-admin" href="{{PREFIX}}admin" style="display:none">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>
          <span>Admin</span>
        </a>
      </nav>
      <div class="side-foot">
        <a class="side-user" href="{{PREFIX}}account">
          <span class="avatar" id="avatar">?</span>
          <span class="name" id="side-user">…</span>
        </a>
        <button class="icon-btn" id="logout" title="Log out">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l-5-5 5-5M5 12h11"/></svg>
        </button>
      </div>
    </aside>

    <div class="content single">
      <div class="main-col" style="width:100%">
        <div class="page-head"><h1>Account</h1></div>

        <div class="panel">
          <div class="panel-head"><h3>Profile</h3></div>
          <div class="kv"><span class="kk">Username</span><span class="vv" id="acc-username">…</span></div>
          <div class="kv"><span class="kk">Signed in</span><span class="vv">Web session</span></div>
        </div>

        <div class="panel">
          <div class="panel-head"><h3>Goals</h3></div>
          <div class="row">
            <div>
              <label for="daily-goal">Daily goal (hours)</label>
              <input id="daily-goal" type="text" inputmode="decimal" placeholder="8">
            </div>
            <div>
              <label for="weekly-goal">Weekly goal (hours)</label>
              <input id="weekly-goal" type="text" inputmode="decimal" placeholder="40">
            </div>
            <div style="flex:0 0 auto">
              <label>&nbsp;</label>
              <button id="save-goals">Save</button>
            </div>
          </div>
          <div id="goals-msg" class="msg"></div>
        </div>

        <div class="panel">
          <div class="panel-head"><h3>Change password</h3></div>
          <form id="pw-form">
            <label for="pw1">New password</label>
            <input id="pw1" type="password" autocomplete="new-password" required>
            <label for="pw2">Confirm new password</label>
            <input id="pw2" type="password" autocomplete="new-password" required>
            <button class="block" type="submit">Update password</button>
          </form>
          <div id="pw-msg" class="msg"></div>
        </div>

        <div class="panel">
          <div class="panel-head"><h3>API token</h3></div>
          <p class="hint">Use this token as the <code>authtoken</code> header for API access. Regenerating invalidates the previous one.</p>
          <div class="token-actions">
            <button id="gen-token">Generate API token</button>
            <button class="secondary" id="regen-token">Regenerate</button>
          </div>
          <div id="token-box" class="token-box"></div>
        </div>

        <div class="panel">
          <div class="panel-head"><h3>Session</h3></div>
          <button class="secondary" id="logout2">Log out</button>
        </div>
      </div>
    </div>
  </div>

  <script src="{{PREFIX}}app.js"></script>
</body>
</html>
