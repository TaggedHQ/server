<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tagged · Shifts</title>
  <link rel="stylesheet" href="{{PREFIX}}style.css?v={{V}}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{PREFIX}}images/favicon_light/favicon-32x32.png?v={{V}}">
  <script>window.TT_PREFIX = "{{PREFIX}}"; window.TT_V = "{{V}}";</script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="side-brand">
        <img class="logo" src="{{PREFIX}}images/Taggd-Colored.svg?v={{V}}" alt="Tagged logo">
        <span class="brandmark" style="letter-spacing:.12em;color:var(--text-1)">Tagged</span>
      </div>
      <nav class="nav">
        <a href="{{PREFIX}}">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          <span>Dashboard</span>
        </a>
        <a href="{{PREFIX}}entries">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          <span>Time entries</span>
        </a>
        <a href="{{PREFIX}}tags">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h8l10 10-8 8L3 11V3z"/><circle cx="7.5" cy="7.5" r="1.5" fill="currentColor" stroke="none"/></svg>
          <span>Tags</span>
        </a>
        <a id="nav-shifts" class="active" href="{{PREFIX}}shifts" style="display:none">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4M16 3v4"/><path d="M8 14h3"/></svg>
          <span>Shifts</span>
        </a>
        <a id="nav-skills" href="{{PREFIX}}skills" style="display:none">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9L12 3z"/></svg>
          <span>Skills</span>
        </a>
        <a href="{{PREFIX}}impexp">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h13M17 8l-3-3M17 8l-3 3"/><path d="M20 16H7M7 16l3-3M7 16l3 3"/></svg>
          <span>Import / Export</span>
        </a>
        <a href="{{PREFIX}}account">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="9" r="3"/><path d="M7 18a5 5 0 0 1 10 0"/></svg>
          <span>Account</span>
        </a>
        <a id="nav-about" href="{{PREFIX}}about">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg>
          <span>About</span>
        </a>
        <div id="nav-admin" class="nav-section">
          <div class="nav-head">Admin</div>
          <a href="{{PREFIX}}users">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span>Users</span>
          </a>
          <a href="{{PREFIX}}roles">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 5-3.5 8-7 9-3.5-1-7-4-7-9V6l7-3z"/><path d="M9.5 12l2 2 3.5-4"/></svg>
            <span>Roles</span>
          </a>
          <a href="{{PREFIX}}groups">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3"/><path d="M6 20v-1a6 6 0 0 1 12 0v1"/><circle cx="5" cy="9" r="2"/><path d="M2 20v-1a4 4 0 0 1 3-3.8"/><circle cx="19" cy="9" r="2"/><path d="M22 20v-1a4 4 0 0 0-3-3.8"/></svg>
            <span>Groups</span>
          </a>
          <a href="{{PREFIX}}settings">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.5-2.3 1a7 7 0 0 0-1.7-1l-.4-2.5h-4l-.4 2.5a7 7 0 0 0-1.7 1l-2.3-1-2 3.5 2 1.5a7 7 0 0 0 0 2l-2 1.5 2 3.5 2.3-1a7 7 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7 7 0 0 0 1.7-1l2.3 1 2-3.5-2-1.5a7 7 0 0 0 .1-1z"/></svg>
            <span>Settings</span>
          </a>
          <a href="{{PREFIX}}oauth">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="15" r="4"/><path d="M10.85 12.15 21 2"/><path d="M18 5l2 2"/><path d="M15 8l2 2"/></svg>
            <span>OAuth</span>
          </a>
        </div>
      </nav>
      <div class="side-foot">
        <a class="side-user" href="{{PREFIX}}account">
          <span class="avatar" id="avatar">?</span>
          <span class="name" id="side-user">…</span>
        </a>
        <button class="icon-btn" id="logout" title="Log out">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l-5-5 5-5M5 12h11"/></svg>
        </button>
      </div>
    </aside>

    <div class="content" id="shifts-layout">
      <div class="main-col">
        <div class="page-head">
          <div>
            <h1>Shifts</h1>
            <p class="page-sub">Plan the week for the groups you control.</p>
          </div>
          <div class="date-nav">
            <button class="pill-btn" id="sh-today">Today</button>
            <button class="icon-btn" id="sh-prev" title="Previous week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
            <button class="icon-btn" id="sh-next" title="Next week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>
            <span class="pill-btn" id="sh-range" style="cursor:default">—</span>
          </div>
        </div>

        <div class="view-switch-row">
          <div class="view-switch" id="sh-tabs" role="tablist" aria-label="View">
            <button type="button" class="vs-btn" data-view="schedule" role="tab">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4M16 3v4"/></svg>
              Schedule
            </button>
            <button type="button" class="vs-btn" data-view="team" role="tab">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              Team
            </button>
          </div>
        </div>

        <div class="tiles five" id="sh-tiles"></div>

        <div class="panel pl-panel" id="sh-schedule">
          <div class="table-wrap">
            <div class="pl-grid" id="pl-grid"></div>
          </div>
          <div id="shifts-msg" class="msg"></div>
        </div>

        <div class="panel" id="sh-team" hidden>
          <div class="table-wrap">
            <table class="utable um-table">
              <thead>
                <tr><th>Member</th><th>Group</th><th>Shifts</th><th>Scheduled</th></tr>
              </thead>
              <tbody id="sh-team-body"></tbody>
            </table>
          </div>
        </div>
      </div>

      <aside class="side-col">
        <div class="panel sh-cal">
          <div class="cal-head">
            <button class="icon-btn" id="sh-cal-prev" title="Previous month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
            <span class="cal-title" id="sh-cal-title">—</span>
            <button class="icon-btn" id="sh-cal-next" title="Next month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>
          </div>
          <div class="cal-grid" id="sh-cal-grid"></div>
        </div>

        <div class="panel sh-details" id="sh-details"></div>

        <div class="panel">
          <div class="panel-head"><h3>Group status</h3></div>
          <div id="sh-status"></div>
        </div>

        <div class="panel">
          <div class="panel-head"><h3>Legend</h3></div>
          <div class="sh-legend" id="sh-legend"></div>
        </div>
      </aside>
    </div>
  </div>

  <!-- Shift editor modal -->
  <div class="modal-overlay" id="sh-modal" hidden>
    <div class="sheet" style="max-width:460px">
      <div class="sheet-title" id="sh-modal-title">New shift</div>
      <div class="sheet-section">
        <div class="sheet-label">Member</div>
        <select id="sh-f-user" class="um-select" style="width:100%"></select>
      </div>
      <div class="sheet-section">
        <div class="sheet-label">Date</div>
        <input id="sh-f-date" class="em-input" type="date">
      </div>
      <div class="sh-row2">
        <div class="sheet-section">
          <div class="sheet-label">Start</div>
          <input id="sh-f-start" class="em-input" type="time" step="900">
        </div>
        <div class="sheet-section">
          <div class="sheet-label">End</div>
          <input id="sh-f-end" class="em-input" type="time" step="900">
        </div>
      </div>
      <div class="sheet-section">
        <div class="sheet-label">Kind</div>
        <select id="sh-f-kind" class="um-select" style="width:100%"></select>
      </div>
      <div class="sheet-section">
        <div class="sheet-label">Note <span class="muted" style="text-transform:none;letter-spacing:0">(optional)</span></div>
        <input id="sh-f-note" class="em-input" type="text" placeholder="Location, hand-over, …" autocomplete="off">
      </div>
      <div id="sh-modal-msg" class="msg"></div>
      <div class="sheet-actions">
        <button class="secondary" id="sh-modal-cancel">Cancel</button>
        <button id="sh-modal-save">Save shift</button>
      </div>
    </div>
  </div>

  <script src="{{PREFIX}}app.js?v={{V}}"></script>
</body>
</html>
