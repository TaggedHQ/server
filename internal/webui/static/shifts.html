<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tagged · Shifts</title>
  <link rel="stylesheet" href="{{PREFIX}}css/style.css?v={{V}}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{PREFIX}}images/favicon_light/favicon-32x32.png?v={{V}}">
  <meta name="tt-prefix" content="{{PREFIX}}">
  <meta name="tt-version" content="{{V}}">
</head>
<body>
  <div class="app">
    {{SIDEBAR}}

    <div class="content" id="shifts-layout">
      <div class="main-col">
        <div class="page-head">
          <div>
            <h1 data-i18n="Shifts">Shifts</h1>
            <p class="page-sub" data-i18n="Plan the week for the groups you control.">Plan the week for the groups you control.</p>
          </div>
          <div class="date-nav">
            <button class="pill-btn" id="sh-today" data-i18n="Today">Today</button>
            <button class="icon-btn" id="sh-prev" title="Previous week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
            <button class="icon-btn" id="sh-next" title="Next week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>
            <span class="pill-btn" id="sh-range" style="cursor:default">—</span>
          </div>
        </div>

        <div class="view-switch-row">
          <div class="view-switch" id="sh-tabs" role="tablist" aria-label="View">
            <button type="button" class="vs-btn" data-view="schedule" role="tab">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4M16 3v4"/></svg>
              <span data-i18n="Schedule">Schedule</span>
            </button>
            <button type="button" class="vs-btn" data-view="team" role="tab">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              <span data-i18n="Team">Team</span>
            </button>
          </div>
        </div>

        <div class="tiles five" id="sh-tiles"></div>

        <div class="panel pl-panel" id="sh-schedule">
          <div class="pl-filters" id="pl-filters"></div>
          <div class="table-wrap">
            <div class="pl-grid" id="pl-grid"></div>
          </div>
          <div id="shifts-msg" class="msg"></div>
        </div>

        <div class="panel" id="sh-team" hidden>
          <div class="table-wrap">
            <table class="utable um-table">
              <thead>
                <tr><th data-i18n="Member">Member</th><th data-i18n="Group">Group</th><th data-i18n="Shifts">Shifts</th><th data-i18n="Scheduled">Scheduled</th></tr>
              </thead>
              <tbody id="sh-team-body"></tbody>
            </table>
          </div>
        </div>
      </div>

      <aside class="side-col">
        <div class="panel sh-cal">
          <div class="cal-head">
            <button class="icon-btn" id="sh-cal-prev" title="Previous month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
            <span class="cal-title" id="sh-cal-title">—</span>
            <button class="icon-btn" id="sh-cal-next" title="Next month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>
          </div>
          <div class="cal-grid" id="sh-cal-grid"></div>
        </div>

        <div class="panel sh-details" id="sh-details"></div>

        <div class="panel">
          <div class="panel-head"><h3 data-i18n="Group status">Group status</h3></div>
          <div id="sh-status"></div>
        </div>

        <div class="panel">
          <div class="panel-head"><h3 data-i18n="Legend">Legend</h3></div>
          <div class="sh-legend" id="sh-legend"></div>
        </div>
      </aside>
    </div>
  </div>

  <!-- Shift editor modal -->
  <div class="modal-overlay" id="sh-modal" hidden>
    <div class="sheet" style="max-width:520px">
      <div class="sheet-title" id="sh-modal-title">New shift</div>
      <div class="sheet-section">
        <div class="sheet-label" data-i18n="Group">Group</div>
        <select id="sh-f-group" class="um-select" style="width:100%"></select>
      </div>
      <div class="sheet-section">
        <div class="sheet-label" data-i18n="Role">Role</div>
        <select id="sh-f-role" class="um-select" style="width:100%"></select>
      </div>
      <div class="sh-row2">
        <div class="sheet-section">
          <div class="sheet-label" data-i18n="Location">Location</div>
          <select id="sh-f-loc" class="um-select" style="width:100%"></select>
        </div>
        <div class="sheet-section">
          <div class="sheet-label" data-i18n="Working area">Working area</div>
          <select id="sh-f-area" class="um-select" style="width:100%"></select>
        </div>
      </div>
      <div class="sheet-section">
        <div class="sheet-label" data-i18n="Date">Date</div>
        <input id="sh-f-date" class="em-input" type="date">
      </div>
      <div class="sh-row2">
        <div class="sheet-section">
          <div class="sheet-label" data-i18n="Start">Start</div>
          <input id="sh-f-start" class="em-input" type="time" step="900">
        </div>
        <div class="sheet-section">
          <div class="sheet-label" data-i18n="End">End</div>
          <input id="sh-f-end" class="em-input" type="time" step="900">
        </div>
      </div>
      <div class="sh-row2">
        <div class="sheet-section">
          <div class="sheet-label" data-i18n="Slots">Slots</div>
          <input id="sh-f-slots" class="em-input" type="number" min="1" max="99" value="1">
        </div>
        <div class="sheet-section">
          <div class="sheet-label" data-i18n="Type">Type</div>
          <select id="sh-f-type" class="um-select" style="width:100%">
            <option value="shift" data-i18n="Shift">Shift</option>
            <option value="absence" data-i18n="Absence">Absence</option>
          </select>
        </div>
      </div>
      <div class="sheet-section">
        <div class="sheet-label" data-i18n="Assign to">Assign to</div>
        <!-- Multi-select checkbox list: multi-slot shifts can carry more than one person. -->
        <div id="sh-f-assign" class="pl-fmenu" style="position:static;box-shadow:none;max-height:150px"></div>
      </div>
      <div class="sheet-section">
        <div class="sheet-label" data-i18n="Tags">Tags <span class="muted" style="text-transform:none;letter-spacing:0" data-i18n="(comma-separated)">(comma-separated)</span></div>
        <input id="sh-f-tags" class="em-input" type="text" placeholder="Weekend cover, hand-over" autocomplete="off">
      </div>
      <div class="sheet-section">
        <div class="sheet-label">Note <span class="muted" style="text-transform:none;letter-spacing:0" data-i18n="(optional)">(optional)</span></div>
        <input id="sh-f-note" class="em-input" type="text" placeholder="Anything the next planner should know" autocomplete="off">
      </div>
      <div id="sh-modal-msg" class="msg"></div>
      <div class="sheet-actions">
        <button class="secondary" id="sh-modal-cancel" data-i18n="Cancel">Cancel</button>
        <button id="sh-modal-save" data-i18n="Save">Save</button>
      </div>
    </div>
  </div>

  <!-- Day-note modal: a place for a per-day, per-group memo. -->
  <div class="modal-overlay" id="sh-note-modal" hidden>
    <div class="sheet" style="max-width:420px">
      <div class="sheet-title" id="sh-note-title" data-i18n="Day note">Day note</div>
      <div class="sheet-section">
        <input id="sh-note-input" class="em-input" type="text" placeholder="Short-staffed, stocktake, …" autocomplete="off">
      </div>
      <div class="sheet-actions">
        <button class="secondary" id="sh-note-cancel" data-i18n="Cancel">Cancel</button>
        <button id="sh-note-save" data-i18n="Save">Save</button>
      </div>
    </div>
  </div>

  <script src="{{PREFIX}}js/core.js?v={{V}}"></script>
  <script src="{{PREFIX}}js/shifts.js?v={{V}}"></script>
</body>
</html>
