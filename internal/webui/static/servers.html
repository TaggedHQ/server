<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tagged · Servers</title>
  <link rel="stylesheet" href="{{PREFIX}}style.css">
  <link rel="icon" type="image/png" sizes="32x32" href="{{PREFIX}}images/favicon_light/favicon-32x32.png">
  <script>window.TT_PREFIX = "{{PREFIX}}";</script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="side-brand">
        <img class="logo" src="{{PREFIX}}images/Taggd-Colored.svg" alt="Tagged logo">
        <span class="brandmark" style="letter-spacing:.12em;color:var(--text-1)">Tagged</span>
      </div>
      <nav class="nav">
        <a href="{{PREFIX}}">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          <span>Dashboard</span>
        </a>
        <a href="{{PREFIX}}entries">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          <span>Time entries</span>
        </a>
        <a href="{{PREFIX}}tags">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h8l10 10-8 8L3 11V3z"/><circle cx="7.5" cy="7.5" r="1.5" fill="currentColor" stroke="none"/></svg>
          <span>Tags</span>
        </a>
        <a href="{{PREFIX}}impexp">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h13M17 8l-3-3M17 8l-3 3"/><path d="M20 16H7M7 16l3-3M7 16l3 3"/></svg>
          <span>Import / Export</span>
        </a>
        <a href="{{PREFIX}}account">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.5-2.3 1a7 7 0 0 0-1.7-1l-.4-2.5h-4l-.4 2.5a7 7 0 0 0-1.7 1l-2.3-1-2 3.5 2 1.5a7 7 0 0 0 0 2l-2 1.5 2 3.5 2.3-1a7 7 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7 7 0 0 0 1.7-1l2.3 1 2-3.5-2-1.5a7 7 0 0 0 .1-1z"/></svg>
          <span>Settings</span>
        </a>
        <a id="nav-about" href="{{PREFIX}}about">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg>
          <span>About</span>
        </a>
        <div id="nav-admin" class="nav-section">
          <div class="nav-head">Admin</div>
          <a href="{{PREFIX}}admin">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span>Users</span>
          </a>
          <a class="active" href="{{PREFIX}}servers">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><line x1="7" y1="7.5" x2="7.01" y2="7.5"/><line x1="7" y1="16.5" x2="7.01" y2="16.5"/></svg>
            <span>Servers</span>
          </a>
          <a href="{{PREFIX}}oauth">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="15" r="4"/><path d="M10.85 12.15 21 2"/><path d="M18 5l2 2"/><path d="M15 8l2 2"/></svg>
            <span>OAuth</span>
          </a>
        </div>
      </nav>
      <div class="side-foot">
        <a class="side-user" href="{{PREFIX}}account">
          <span class="avatar" id="avatar">?</span>
          <span class="name" id="side-user">…</span>
        </a>
        <button class="icon-btn" id="logout" title="Log out">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l-5-5 5-5M5 12h11"/></svg>
        </button>
      </div>
    </aside>

    <div class="content single">
      <div class="main-col" style="width:100%">
        <div class="page-head"><h1>Admin · Servers</h1></div>

        <div class="panel" id="servers-page">
          <div class="panel-head"><h3>Registration</h3></div>
          <label class="setting-row" for="reg-toggle">
            <span class="setting-label">
              <strong>Allow new users to register</strong>
              <span class="muted">When off, visitors can no longer create their own accounts on the sign-up page. Admins can still create users here.</span>
            </span>
            <span class="toggle">
              <input type="checkbox" id="reg-toggle" disabled>
              <span class="slider"></span>
            </span>
          </label>
          <div id="servers-msg" class="msg"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="{{PREFIX}}app.js"></script>
</body>
</html>
