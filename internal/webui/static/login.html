<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · Tagged</title>
  <link rel="stylesheet" href="{{PREFIX}}style.css?v={{V}}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{PREFIX}}images/favicon_light/favicon-32x32.png?v={{V}}">
  <meta name="tt-prefix" content="{{PREFIX}}">
  <meta name="tt-version" content="{{V}}">
</head>
<body>
  <div class="center-page">
    <div class="card narrow">
      <div class="auth-head">
        <img class="auth-logo" src="{{PREFIX}}images/Taggd-Colored.svg?v={{V}}" alt="Tagged logo">
        <div class="brandmark lg">Tagged</div>
        <p class="subtitle">Log in to your account</p>
      </div>
      <form id="login-form">
        <label for="username">Username</label>
        <input id="username" type="text" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <button class="block" type="submit">Log in</button>
      </form>
      <button class="block secondary" id="passkey-login" type="button" hidden>
        <svg class="oauth-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="width:16px;height:16px;vertical-align:-3px;margin-right:6px"><circle cx="8" cy="15" r="4"/><path d="M10.85 12.15 21 2"/><path d="M18 5l2 2"/><path d="M15 8l2 2"/></svg>
        <span data-i18n="Sign in with a passkey">Sign in with a passkey</span>
      </button>
      <form id="mfa-form" hidden>
        <label for="mfa-code">Authentication code</label>
        <input id="mfa-code" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit code or backup code" required>
        <button class="block" type="submit">Verify</button>
        <p class="alt"><a href="#" id="mfa-back">← Back to login</a></p>
      </form>
      <div id="msg" class="msg"></div>
      <div id="oauth-section" class="oauth-section" hidden>
        <div class="oauth-divider"><span>or</span></div>
        <div id="oauth-buttons" class="oauth-buttons"></div>
      </div>
      <p class="alt" id="login-alt">No account? <a href="{{PREFIX}}register">Create one</a></p>
    </div>
  </div>
  <script src="{{PREFIX}}app.js?v={{V}}"></script>
</body>
</html>
