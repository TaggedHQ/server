<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tagged · Dashboard</title>
  <link rel="stylesheet" href="{{PREFIX}}css/style.css?v={{V}}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{PREFIX}}images/favicon_light/favicon-32x32.png?v={{V}}">
  <meta name="tt-prefix" content="{{PREFIX}}">
  <meta name="tt-version" content="{{V}}">
</head>
<body>
  <div class="app">
    {{SIDEBAR}}

    <div class="content">
      <div class="main-col">
        <div class="page-head">
          <h1 data-i18n="Dashboard">Dashboard</h1>
          <div class="date-nav">
            <button class="pill-btn" id="today-btn">Today</button>
            <button class="icon-btn" id="prev-day" title="Previous day" data-i18n-title="Previous day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
            <button class="icon-btn" id="next-day" title="Next day" data-i18n-title="Next day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>
          </div>
        </div>

        <div class="tiles">
          <div class="tile">
            <div class="k"><span data-i18n="Total">Total</span> (<span id="tile-scope">today</span>)</div>
            <div class="v" id="tile-total">0h 00m</div>
            <div class="sub" id="tile-total-goal">Goal 8h 00m</div>
            <div class="bar"><span id="tile-total-bar" style="width:0%"></span></div>
          </div>
          <div class="tile">
            <div class="k" data-i18n="Entries">Entries</div>
            <div class="v" id="tile-entries">0</div>
            <div class="sub" id="tile-entries-delta">—</div>
          </div>
          <div class="tile">
            <div class="k" data-i18n="Longest block">Longest block</div>
            <div class="v" id="tile-longest">0h 00m</div>
            <div class="sub" id="tile-longest-range">—</div>
          </div>
          <div class="tile">
            <div class="k" data-i18n="Most active tag">Most active tag</div>
            <div class="v" style="font-size:1rem;margin-top:10px"><span class="badge" id="tile-toptag" style="background:var(--accent-dim);color:var(--accent)">—</span></div>
            <div class="sub"><span id="tile-toptag-dur">0h 00m</span> · <span id="tile-toptag-pct">0%</span></div>
          </div>
        </div>

        <div class="panel" id="panel-allocation">
          <div class="panel-head"><h3 data-i18n="Time allocation">Time allocation</h3><span class="sub" data-i18n="By tags">By tags</span></div>
          <div class="alloc">
            <div class="donut-wrap">
              <svg id="donut" viewBox="0 0 42 42" width="150" height="150"></svg>
              <div class="donut-center"><div><div class="d-total" id="donut-total">0h 00m</div><div class="d-label" data-i18n="Total">Total</div></div></div>
            </div>
            <div class="legend" id="alloc-legend"></div>
          </div>
        </div>

        <div class="panel" id="panel-entries">
          <div class="panel-head"><h3 data-i18n="Entries">Entries</h3><a class="link" href="{{PREFIX}}entries" data-i18n="View all">View all</a></div>
          <div id="entries-list"></div>
        </div>
      </div>

      <div class="side-col">
        <div class="panel" id="panel-calendar">
          <div class="cal-head">
            <button class="icon-btn" id="cal-prev" title="Previous month" data-i18n-title="Previous month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
            <span class="m" id="cal-title">—</span>
            <button class="icon-btn" id="cal-next" title="Next month" data-i18n-title="Next month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>
          </div>
          <div class="cal-grid" id="cal-grid"></div>
          <div class="cal-foot"><span class="l" data-i18n="Duration">Duration</span><span class="v" id="cal-duration">0h 00m</span></div>
        </div>

        <div class="panel">
          <div class="panel-head" id="panel-tags"><h3 data-i18n="Tags">Tags</h3></div>
          <div id="tags-list"></div>
        </div>

        <div class="panel">
          <div class="panel-head"><h3 data-i18n="Goals">Goals</h3><a class="link" href="{{PREFIX}}account" data-i18n="Edit">Edit</a></div>
          <div class="goal">
            <div class="goal-top"><span class="g-name" data-i18n="Daily goal">Daily goal</span><span class="g-target" id="goal-daily-target">8h 00m</span></div>
            <div class="bar green" style="margin-top:8px"><span id="goal-daily-bar" style="width:0%"></span></div>
            <div class="goal-sub green" id="goal-daily-sub">0h 00m / 8h 00m</div>
          </div>
          <div class="goal">
            <div class="goal-top"><span class="g-name" data-i18n="Weekly goal">Weekly goal</span><span class="g-target" id="goal-weekly-target">40h 00m</span></div>
            <div class="bar" style="margin-top:8px"><span id="goal-weekly-bar" style="width:0%"></span></div>
            <div class="goal-sub gold" id="goal-weekly-sub">0h 00m / 40h 00m</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="{{PREFIX}}js/core.js?v={{V}}"></script>
  <script src="{{PREFIX}}js/dashboard.js?v={{V}}"></script>
</body>
</html>
