<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tagged · Roles</title>
  <link rel="stylesheet" href="{{PREFIX}}css/style.css?v={{V}}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{PREFIX}}images/favicon_light/favicon-32x32.png?v={{V}}">
  <meta name="tt-prefix" content="{{PREFIX}}">
  <meta name="tt-version" content="{{V}}">
</head>
<body>
  <div class="app">
    {{SIDEBAR}}

    <div class="content" id="roles-layout">
      <div class="main-col" style="width:100%">
        <div class="page-head">
          <div>
            <h1 data-i18n="Roles &amp; Permissions">Roles &amp; Permissions</h1>
            <p class="page-sub" data-i18n="Choose what each role is allowed to do on your Tagged server.">Choose what each role is allowed to do on your Tagged server.</p>
          </div>
          <div class="head-actions">
            <button id="add-role-btn" class="btn-round" title="New role" data-i18n-title="New role" aria-label="New role" data-i18n-aria-label="New role">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>
        </div>

        <div class="panel um-panel">
          <div class="table-wrap">
            <table class="utable um-table">
              <thead>
                <tr><th data-i18n="Role">Role</th><th data-i18n="Permissions">Permissions</th><th data-i18n="Members">Members</th><th></th></tr>
              </thead>
              <tbody id="roles-body">
                <tr><td colspan="4" class="muted" data-i18n="Loading…">Loading…</td></tr>
              </tbody>
            </table>
          </div>
          <div id="roles-msg" class="msg"></div>
        </div>
      </div>

      <aside class="side-col">
        <div class="panel um-details" id="role-details">
          <div class="um-empty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 5-3.5 8-7 9-3.5-1-7-4-7-9V6l7-3z"/><path d="M9.5 12l2 2 3.5-4"/></svg>
            <p data-i18n="Select a role to view and edit its permissions.">Select a role to view and edit its permissions.</p>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <!-- New / edit role modal -->
  <div class="modal-overlay" id="role-modal" hidden>
    <div class="sheet" style="max-width:440px">
      <div class="sheet-title" id="rm-title" data-i18n="New role">New role</div>
      <div class="sheet-section">
        <div class="sheet-label" data-i18n="Name">Name</div>
        <input id="rm-name" class="em-input" type="text" placeholder="Team lead" data-i18n-placeholder="Team lead" autocomplete="off">
      </div>
      <div class="sheet-section">
        <div class="sheet-label">Description <span class="muted" style="text-transform:none;letter-spacing:0" data-i18n="(optional)">(optional)</span></div>
        <input id="rm-desc" class="em-input" type="text" placeholder="What this role is for" data-i18n-placeholder="What this role is for" autocomplete="off">
      </div>
      <p class="muted um-note" style="text-align:center;margin:0 0 4px" data-i18n="Permissions are set on the role after it exists.">Permissions are set on the role after it exists.</p>
      <div id="rm-msg" class="msg"></div>
      <div class="sheet-actions">
        <button class="secondary" id="rm-cancel" data-i18n="Cancel">Cancel</button>
        <button id="rm-save" data-i18n="Create role">Create role</button>
      </div>
    </div>
  </div>

  <script src="{{PREFIX}}js/core.js?v={{V}}"></script>
  <script src="{{PREFIX}}js/admin.js?v={{V}}"></script>
</body>
</html>
