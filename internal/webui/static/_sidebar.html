<!-- The shared sidebar, injected into every signed-in page by webui.Get() at the
     {{SIDEBAR}} marker. It lives here rather than in each page because it was
     copied into 17 files and had already drifted: the Admin section was left
     visible on 11 of them, flashing the admin menu at non-admins until whoami
     answered, and three files carried stray trailing whitespace.

     Nav visibility is decided at runtime by revealChrome() in core.js, from the
     caller's capabilities and the enabled modules -- so everything optional is
     hidden here and opened there, never the other way round.

     data-nav names the page a link leads to. Get() marks the matching one
     active, so no page has to state which entry is its own.

     Two collapse controls, both wired and persisted in core.js: the button in
     the brand row toggles the whole sidebar to an icon-only rail (macOS style),
     and each section heading (Skills, Admin) folds its own entries away. The
     rail state is applied before first paint so it does not flash open on every
     navigation.

     On a narrow screen the sidebar cannot sit beside the content, so it becomes
     an off-canvas drawer: the compact top bar below carries a hamburger that
     slides the full sidebar in over a backdrop. Both are display:none on the
     desktop grid and only take part in the layout under the mobile breakpoint;
     core.js wires the toggle. -->
    <div class="mobile-topbar">
      <button class="mobile-nav-toggle" id="mobile-nav-toggle" type="button" title="Menu" data-i18n-title="Menu" aria-label="Menu" aria-expanded="false" aria-controls="app-sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <a class="mtb-brand" href="{{PREFIX}}">
        <img class="logo" src="{{PREFIX}}images/Taggd-Colored.svg?v={{V}}" alt="">
        <span class="brandmark" style="letter-spacing:.12em;color:var(--text-1)">Tagged</span>
      </a>
    </div>
    <div class="nav-backdrop" id="nav-backdrop"></div>
    <aside class="sidebar" id="app-sidebar">

        <img class="logo" src="{{PREFIX}}images/Taggd-Colored.svg?v={{V}}" alt="Tagged logo">

        <button class="side-rail-btn" id="side-rail" type="button" title="Collapse sidebar" data-i18n-title="Collapse sidebar" aria-label="Collapse sidebar" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
        </button>
